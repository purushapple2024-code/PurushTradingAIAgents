[project]
name = "ptaa"
version = "0.1.0"
description = "PurushTradingAIAgents: zero-cost, ML-first, multi-agent paper-trading system for NSE equities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Purushotham Ranganath" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "typer>=0.12",
  "rich>=13.7",
  "yfinance>=0.2.40",
  "requests>=2.32",
  "websockets>=12.0",
  "SQLAlchemy>=2.0",
  "sqlmodel>=0.0.21",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "lightgbm>=4.3",
  "scikit-learn>=1.5",
  "ddgs>=9.0",
  "feedparser>=6.0",
  "trafilatura>=1.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.35",
  "plotly>=5.20",
]

[project.optional-dependencies]
brokers = [
  "smartapi-python>=1.4",
  "pyotp>=2.9",
  "upstox-python-sdk>=2.9",
  "protobuf>=4.25",
]
ml = [
  "shap>=0.45",
  "onnxruntime>=1.18",
]
llm = [
  "ollama>=0.3",
]
nlp = [
  "transformers>=4.40",
  "torch>=2.2",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
ptaa = "ptaa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptaa"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "terminal"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"src/ptaa/cli.py" = ["E501"]
"src/ptaa/training/*" = ["N806"]  # X / y are conventional
"src/ptaa/graph/nodes/*" = ["E501"]  # long f-string reports
"src/ptaa/llm/*" = ["E501"]  # prompt strings
"terminal/*" = ["E501"]
"src/ptaa/control/*" = ["E501"]
"src/ptaa/alerts/*" = ["E501"]
"src/ptaa/execution/*" = ["E501"]  # broker payloads

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["ptaa"]
